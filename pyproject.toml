[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-kwl-ec300"
version = "0.3.0"
description = "Helios KWL EC 300W R ventilation monitoring — library, CLI, and Home Assistant integration"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["pydantic>=2.0,<3.0"]

[project.scripts]
helios = "helios_cli.main:main"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "homeassistant>=2024.3.3",
]

# ── Shared Tool Configuration ────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "A", "C4", "PT"]
ignore = [
    "ANN401", # Dynamically typed expressions (Any)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["ANN"]
"tests/ha/conftest.py" = ["A002", "N818", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests/lib", "tests/ha"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "voluptuous",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.ha.*"
ignore_errors = true
